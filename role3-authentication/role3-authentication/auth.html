<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueLess Ghana | Login & Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand">
            <div class="brand-logo">Q</div>
            <div class="brand-text">
                <strong>QueueLess</strong>
                <span>GHANA <i class="ghana-flag"></i></span>
            </div>
        </a>
        <div class="nav-links">
            <a href="index.html">← Back to Home</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="tabs">
            <button type="button" id="loginTab" class="tab-btn active" onclick="switchTab('login')">Sign In</button>
            <button type="button" id="registerTab" class="tab-btn" onclick="switchTab('register')">Register Account</button>
        </div>

        <div id="formError" class="error-msg"></div>

        <!-- LOGIN FORM -->
        <form id="loginForm" action="auth_process.php" method="POST" onsubmit="return validateLogin()">
            <input type="hidden" name="action" value="login">

            <label>Email Address</label>
            <input type="email" id="loginEmail" name="email" placeholder="you@example.com" required>

            <label>Password</label>
            <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>

            <button type="submit" class="btn-submit">Sign In to QueueLess</button>
        </form>

        <!-- REGISTRATION FORM -->
        <form id="registerForm" class="hidden" action="auth_process.php" method="POST" onsubmit="return validateRegister()">
            <input type="hidden" name="action" value="register">

            <label>Select Account Role</label>
            <select id="userRole" name="role" onchange="toggleShopFields()">
                <option value="customer">Customer (Join queues & track position)</option>
                <option value="stylist">Barber / Stylist (Serve waiting customers)</option>
                <option value="admin">Administrator / Owner (Manage barbershop or salon)</option>
            </select>

            <label>Full Name</label>
            <input type="text" id="regName" name="full_name" placeholder="e.g., David Amoako" required>

            <label>Email Address</label>
            <input type="email" id="regEmail" name="email" placeholder="david@example.com" required>

            <label>Phone Number (For Queue SMS/Alerts)</label>
            <input type="tel" id="regPhone" name="phone" placeholder="024 XXX XXXX" required>

            <!-- Barbershop / Salon Fields for Stylists & Owners -->
            <div id="shopFields" class="hidden">
                <label>Barbershop or Salon Name</label>
                <input type="text" id="shopName" name="shop_name" placeholder="e.g., Isaac's Barbershop">

                <label>Business Type</label>
                <select id="shopType" name="shop_type">
                    <option value="Barbershop">Barbershop</option>
                    <option value="Salon">Hair & Beauty Salon</option>
                    <option value="Unisex Salon">Unisex Salon & Spa</option>
                </select>
            </div>

            <label>Password</label>
            <input type="password" id="regPassword" name="password" placeholder="At least 6 characters" required>

            <label>Confirm Password</label>
            <input type="password" id="regConfirmPassword" placeholder="Re-enter password" required>

            <button type="submit" class="btn-submit">Create QueueLess Account</button>
        </form>
    </div>

    <script src="validation.js"></script>
</body>
</html>
